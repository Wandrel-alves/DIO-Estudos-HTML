<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #links {
            background-color: lightblue;
            width: 200px;
        }

        div {
            background-color: lightgreen;
        }

        span {
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div id="links">
        <li><a href="#">link 1</a></li>
        <li><a href="#">link 2</a></li>
        <li><a href="#">link 3</a></li>
    </div>

    <p>dio<div>.</div> me </p>

    <p>dio<span>.</span> me </p>

    <!-- Div ocupa todo o espaço horizontal da página -->
    <!-- Span é um elemento inline, ou seja, ele só ocupa o espaço necessário para o conteúdo que ele contém -->
</body>
</html>
