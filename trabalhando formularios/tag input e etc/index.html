<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label><input type="text"><br>
        <label for="email">Email:</label><input type="email"><br>
        <label for="password">Password:</label><input type="number"><br>
        <label for="range">Range:</label><input type="range"><br>
        <label for="color">Color:</label><input type="color"><br>
        <label for="url">URL:</label><input type="url"><br>
        <label for="date">Date:</label><input type="date"><br>
        <label for="week">Week:</label><input type="week"><br>
        <label for="month">Month:</label><input type="month"><br>
        <label for="checkbox">Checkbox:</label><input type="checkbox"><input type="checkbox"><br> <!--Check pode marcar multiplas-->
        <label for="radio">Radio:</label><input type="radio" name="radio"><input type="radio" name="radio"><br> <!--radio não marca multiplas-->
        <label for="hidden"></label>Hidden:<input type="hidden" value="valor oculto"><br>
        <label for="file"></label>File:<input type="file" multiple><br><!--multiple para escolher multiplos arquivos caso n queria só n colocar-->
        <label for="search"></label>Search:<input type="search" value="Buscar"><br>
        <label for="button"></label><input type="button" value="Enviar"><br>
    </form>
</body>
</html>
